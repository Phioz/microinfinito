  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"d545c604-2d1a-4f57-a78a-2782a0b346a9\"><\u002Fscript>\n<style>\nbody{margin:0}\na{color:var(--color-accent);text-decoration:none}\na:hover{color:var(--color-accent-2)}\n.mi-wrap{max-width:1100px;margin:0 auto;padding:0 var(--space-4)}\n.mi-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8);align-items:center}\n@media (max-width: 760px){.mi-row{grid-template-columns:1fr}}\n.mi-nav a{font-size:14px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:{{ pageBg }};min-height:100vh\">\n<nav class=\"nav mi-wrap\" style=\"padding-top:var(--space-4);padding-bottom:var(--space-4);flex-wrap:wrap;row-gap:var(--space-2)\">\n  <a class=\"nav-brand\" href=\"index.html\" style=\"color:var(--color-text)\">Philip Klawitter<\u002Fa>\n  <a class=\"mi-nav\" href=\"index.html\" aria-current=\"page\">{{ t.navHome }}<\u002Fa>\n  <a class=\"mi-nav\" href=\"exoplaneta.html\">Exoplaneta<\u002Fa>\n  <a class=\"mi-nav\" href=\"ecosintesis.html\">Ecosíntesis<\u002Fa>\n  <a class=\"mi-nav\" href=\"panspermia.html\">Panspermia<\u002Fa>\n  <a class=\"mi-nav\" href=\"about.html\">{{ t.navAbout }}<\u002Fa>\n  <a class=\"mi-nav\" href=\"contact.html\">{{ t.navContact }}<\u002Fa>\n  <div class=\"seg\" style=\"margin-left:var(--space-3)\">\n    <label class=\"seg-opt\"><input type=\"radio\" name=\"lang\" checked=\"{{ isEs }}\" sc-camel-on-change=\"{{ setEs }}\">ES<\u002Flabel>\n    <label class=\"seg-opt\"><input type=\"radio\" name=\"lang\" checked=\"{{ isEn }}\" sc-camel-on-change=\"{{ setEn }}\">EN<\u002Flabel>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<div class=\"mi-wrap\" style=\"display:flex;flex-direction:column\">\n<section style=\"padding-top:var(--space-4);padding-bottom:var(--space-6);order:{{ videoOrder }}\">\n  <div class=\"card\" style=\"aspect-ratio:16/9;padding:0;overflow:hidden;position:relative\">\n    <iframe src=\"https://player.vimeo.com/video/379624805?title=fa 02Fx-import>\n    <\u002Fdiv>\n    <div style=\"order:1\">\n      <h2>{{ t.h2 }}<\u002Fh2>\n      <p style=\"margin-top:var(--space-4)\">{{ t.p3 }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"mi-wrap\" style=\"padding-bottom:var(--space-8)\">\n  <h2>{{ t.h3 }}<\u002Fh2>\n  <div class=\"mi-row\" style=\"margin-top:var(--space-4)\">\n    <div>\n      <p>{{ t.p4 }}<\u002Fp>\n      <p>{{ t.p5 }}<\u002Fp>\n      <p>{{ t.p6 }}<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"lighten\" style=\"width:100%;height:320px\">\n      <x-import component-from-global-scope=\"image-slot\" from=\"886ffe2c-0999-4550-a48a-502ce07ff3b2#/image-slot.js\" id=\"home-3\" src=\"392457fb-41e8-4647-9758-9ee2220a1d20\" placeholder=\"Registro visual del micromundo\" hint-size=\"100%,320px\"><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"mi-wrap\" style=\"padding-bottom:var(--space-8)\">\n  <div class=\"card\" style=\"aspect-ratio:16/9;padding:0;overflow:hidden;position:relative\">\n    <iframe src=\"https://player.vimeo.com/video/469811168?title=false&amp;byline=false&amp;portrait=false\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\" allow=\"fullscreen\" title=\"Biogénesis — documental 2\"><\u002Fiframe>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"mi-wrap\" style=\"padding-bottom:var(--space-8)\">\n  <div class=\"lighten\" style=\"width:100%;aspect-ratio:12392/2592\">\n    <x-import component-from-global-scope=\"image-slot\" from=\"886ffe2c-0999-4550-a48a-502ce07ff3b2#/image-slot.js\" id=\"home-planets-row\" src=\"https://static.wixstatic.com/media/3916e8_024d822246d24f2392387649b170132c~mv2_d_12392_2592_s_2.png\" fit=\"contain\" placeholder=\"Crecimiento de los mundos, 5 meses\" hint-size=\"100%,202px\"><\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"mi-wrap\" style=\"padding-bottom:var(--space-8)\">\n  <div class=\"mi-row\" style=\"align-items:start\">\n    <div>\n      <h3>{{ t.descGeneral }}<\u002Fh3>\n      <p style=\"margin-top:var(--space-3)\">{{ t.p1 }}<\u002Fp>\n      <p>{{ t.p2 }}<\u002Fp>\n      <div class=\"lighten\" style=\"width:100%;max-width:360px;aspect-ratio:4152/2773;margin:var(--space-4) auto 0\">\n        <x-import component-from-global-scope=\"image-slot\" from=\"886ffe2c-0999-4550-a48a-502ce07ff3b2#/image-slot.js\" id=\"home-setup\" src=\"60619165-88ad-4b2b-8487-ee8022e2d4fe\" fit=\"contain\" placeholder=\"Sistema de registro\" hint-size=\"100%,100%\"><\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h3>{{ t.descConceptual }}<\u002Fh3>\n      <p style=\"margin-top:var(--space-3)\">{{ t.p4 }}<\u002Fp>\n      <p>{{ t.p5 }}<\u002Fp>\n      <p>{{ t.p6 }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"mi-wrap\" style=\"padding-bottom:var(--space-8)\">\n  <div class=\"card\" style=\"aspect-ratio:16/9;padding:0;overflow:hidden;position:relative\">\n    <iframe src=\"https://player.vimeo.com/video/469811753?title=false&amp;byline=false&amp;portrait=false\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\" allow=\"fullscreen\" title=\"Biogénesis — documental 3\"><\u002Fiframe>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"mi-wrap\" style=\"padding-bottom:var(--space-8)\">\n  <div class=\"mi-row\">\n    <div class=\"card\" style=\"aspect-ratio:16/9;padding:0;overflow:hidden;position:relative\">\n      <iframe src=\"https://player.vimeo.com/video/190735166?title=false&amp;byline=false&amp;portrait=false\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\" allow=\"fullscreen\" title=\"Biogénesis — video 4\"><\u002Fiframe>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"aspect-ratio:16/9;padding:0;overflow:hidden;position:relative\">\n      <iframe src=\"https://player.vimeo.com/video/198111775?title=false&amp;byline=false&amp;portrait=false\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\" allow=\"fullscreen\" title=\"Biogénesis — video 5\"><\u002Fiframe>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"mi-wrap\" style=\"padding-bottom:var(--space-8)\">\n  <div class=\"mi-row\">\n    <div class=\"card\" style=\"aspect-ratio:16/9;padding:0;overflow:hidden;position:relative\">\n      <iframe src=\"https://player.vimeo.com/video/164933751?title=false&amp;byline=false&amp;portrait=false\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\" allow=\"fullscreen\" title=\"Biogénesis — video 6\"><\u002Fiframe>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"aspect-ratio:16/9;padding:0;overflow:hidden;position:relative\">\n      <iframe src=\"https://player.vimeo.com/video/190803020?title=false&amp;byline=false&amp;portrait=false\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\" allow=\"fullscreen\" title=\"Biogénesis — video 7\"><\u002Fiframe>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"mi-wrap\" style=\"padding:var(--space-8) var(--space-4);display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);border-top:1px solid var(--color-divider);font-size:12px\" data-om-raster=\"false\">\n  <span class=\"text-muted\">© 2019–2026 Philip Klawitter<\u002Fspan>\n  <div style=\"display:flex;gap:var(--space-4)\">\n    <a href=\"https://www.instagram.com/philipklawitter/\" target=\"_blank\" rel=\"noopener\">Instagram<\u002Fa>\n    <a href=\"https://www.facebook.com/Microinfinitoart/\" target=\"_blank\" rel=\"noopener\">Facebook<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bgTone&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#08080f&quot;,&quot;options&quot;:[&quot;#161826&quot;,&quot;#0d0e16&quot;,&quot;#08080f&quot;,&quot;#1c1f30&quot;,&quot;#000000&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;heroTextFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Appearance&quot;}}\">\nconst ES = {\n  navHome: \"Biogénesis\", navAbout: \"About\", navContact: \"Contacto\",\n  kicker: \"Microinfinito — obra\",\n  intro: \"Biogénesis hace crecer micro-planetas de musgo dentro de una máquina construida por el artista, y registra su desarrollo a través del tiempo. Es la pieza más reciente de Microinfinito, un proyecto de siete años de Philip Klawitter.\",\n  curatorQuote: \"Microinfinito, es el nombre de esta exposición y del proyecto, que Philip Klawitter exhibe en la Sala de Arte CCU, en el contexto de la 14° Bienal de Artes Mediales: El cuarto mundo. A pesar de su escala al ojo, Microinfinito es un proyecto inabarcable, por su extrema carga interpretativa, al mismo tiempo que es abierto y polisémico, es cerrado y tautológico. Contradicciones que son la premisa del artista cuando enfrenta su mapa conceptual, que en sí compendia: historia, ciencia, filosofía, ecología y antiguas creencias, para explicar los portentos de la naturaleza. Lo que asumimos aquí no es solo el atlas de un nuevo mundo, creado a microescala por el artista. Es la metáfora del Fausto postmoderno anclado en las utopías del siglo XXI.\",\n  curatorName: \"Arturo Duclos, curador\",\n  h1: \"Cómo funciona la obra\",\n  p1: \"Biogénesis pertenece a un proceso de trabajo que Philip Klawitter ha realizado durante los últimos siete años, como parte de un work in progress de la serie Microinfinito, en la cual se busca desarrollar y registrar a nivel visual la vida existente en el micromundo, de manera tal que podamos percibirlo de manera macro.\",\n  p2: \"A través de dos instalaciones principales, la primera funciona como incubadora de micro planetas donde se produce el desarrollo material de la obra: la vida del musgo y las condiciones ambientales propicias para su crecimiento. La segunda instalación consiste en el sistema de registro visual, que permite examinar la vida en los micromundos y cómo el paso del tiempo los afecta directamente.\",\n  h2: \"La vida en el micromundo\",\n  p3: \"En Biogénesis asistimos a un estado avanzado a nivel biológico. Hasta ahora encontramos, aparte de los musgos, hongos y organizaciones vegetales, rasgos básicos de vida: diminutos organismos que surgen en la forma de células organizadas. La investigación científica ha establecido a la célula como la unidad más simple y pequeña de vida independiente. Estas pequeñas manifestaciones impregnan de movimiento y vitalidad estos microhábitats, y tal como distingue Humberto Maturana: “Quien no acepta la espontaneidad de los procesos moleculares, no puede aceptar la espontaneidad de las coherencias operacionales entre el ser vivo y el medio propias del vivir”.\",\n  h3: \"Qué significa la obra\",\n  p4: \"El objetivo principal del proyecto Biogénesis es evocar lo más grande a través de lo más pequeño. Se hace referencia tanto al principio hermenéutico de “como es arriba es abajo; como es abajo es arriba”, como a la cualidad fractal del universo, por la cual lo ínfimo es similar a lo astronómico.\",\n  p5: \"Replicar lo macro en lo micro permite encontrar nuevos procesos de información, o herramientas para comprender el funcionamiento del mundo. En el caso de los microplanetas, se puede explicar el surgimiento y la forma en que la vida se produce y desarrolla; así también observar cómo diversos factores influyen en estos procesos, tal como explica la panspermia, teoría sobre cómo la vida migra a través del universo.\",\n  p6: \"Biogénesis permite observar y registrar visualmente procesos que empiezan desde la inoculación —entendida como una forma de injertar información en el ambiente— hasta el surgimiento de otros microorganismos y sistemas de vida interconectados, producidos por diversos factores ambientales, tal como ocurre en nuestro planeta.\",\n  h4: \"Documental\",\n  docNote: \"Video documental — pendiente de subir.\",\n  descGeneral: \"Descripción general de la obra\",\n  descConceptual: \"Descripción conceptual de la obra\"\n};\nconst EN = {\n  navHome: \"Biogenesis\", navAbout: \"About\", navContact: \"Contact\",\n  kicker: \"Microinfinito — artwork\",\n  intro: \"Biogenesis grows moss micro-planets inside a machine built by the artist, and records their development over time. It is the newest piece of Microinfinito, a seven-year project by Philip Klawitter.\",\n  curatorQuote: \"Microinfinito is the name of this exhibition and of the project that Philip Klawitter presents at Sala de Arte CCU, within the 14th Media Arts Biennial: The Fourth World. Small in scale to the eye, Microinfinito is nonetheless an unencompassable project given its extreme interpretive load — open and polysemic, yet closed and tautological. These contradictions are the artist's premise as he confronts his conceptual map, which compiles history, science, philosophy, ecology and ancient beliefs to explain the wonders of nature. What we encounter here is not only the atlas of a new world, created at micro-scale by the artist — it is the metaphor of a postmodern Faust anchored in the utopias of the 21st century.\",\n  curatorName: \"Arturo Duclos, curator\",\n  h1: \"How the piece works\",\n  p1: \"Biogenesis belongs to a body of work Philip Klawitter has developed over the last seven years, as part of an ongoing series, Microinfinito, which seeks to develop and visually record the life that exists in the micro-world, so that we might perceive it at macro scale.\",\n  p2: \"The work runs through two main installations. The first acts as an incubator for micro-planets, where the material development of the piece takes place: the life of the moss and the environmental conditions suited to its growth. The second installation is the visual registration system, which allows the life in the micro-worlds to be examined and shows how the passage of time directly affects them.\",\n  h2: \"Life in the micro-world\",\n  p3: \"In Biogenesis we witness an advanced biological state. Beyond mosses, fungi and plant organizations, we find basic traits of life: tiny organisms that arise in the form of organized cells. Scientific research has established the cell as the simplest and smallest unit of independent life. These small manifestations fill these micro-habitats with movement and vitality, and as Humberto Maturana notes: “Whoever does not accept the spontaneity of molecular processes cannot accept the spontaneity of the operational coherences between the living being and its environment that are proper to living.”\",\n  h3: \"What the piece means\",\n  p4: \"The main objective of the Biogenesis project is to evoke the largest through the smallest — referencing both the hermetic principle “as above, so below” and the fractal quality of the universe, by which the infinitesimal resembles the astronomical.\",\n  p5: \"Replicating the macro in the micro allows new information processes and tools to emerge for understanding how the world works. In the case of micro-planets, it can explain how life arises and develops, and how different factors influence these processes — as panspermia, the theory of how life migrates across the universe, proposes.\",\n  p6: \"Biogenesis allows us to observe and visually record processes that begin with inoculation — understood as a way of grafting information into the environment — through to the emergence of other interconnected microorganisms and life systems, produced by various environmental factors, just as happens on our own planet.\",\n  h4: \"Documentary\",\n  docNote: \"Documentary video — coming soon.\",\n  descGeneral: \"General description of the piece\",\n  descConceptual: \"Conceptual description of the piece\"\n};\nclass Component extends DCLogic {\n  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('mi-lang')) || 'es' };\n  setLang(l) { this.setState({ lang: l }); try { localStorage.setItem('mi-lang', l); } catch (e) {} }\n  renderVals() {\n    const isEs = this.state.lang === 'es';\n    return { t: isEs ? ES : EN, isEs, isEn: !isEs, setEs: () => this.setLang('es'), setEn: () => this.setLang('en'), pageBg: this.props.bgTone ?? '#08080f', headerOrder: (this.props.heroTextFirst ?? true) ? 1 : 2, videoOrder: (this.props.heroTextFirst ?? true) ? 2 : 1 };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
